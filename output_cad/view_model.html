<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同步轮固定法兰 - 3D 交互预览</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1e1e24 0%, #2a2b36 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            line-height: 1.5;
            font-size: 13px;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: 600;
            color: #38bdf8;
        }
        .param-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 4px;
        }
        .param-name {
            color: #94a3b8;
        }
        .param-val {
            font-family: monospace;
            color: #f1f5f9;
        }
        #controls-tip {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 28, 0.7);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #btn-group {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
    <!-- 引入 Three.js 和 OrbitControls, STLLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h2>同步轮固定法兰</h2>
        <div class="param-row"><span class="param-name">法兰盘外径</span><span class="param-val">Φ 60.0 mm</span></div>
        <div class="param-row"><span class="param-name">中心轴通孔</span><span class="param-val">Φ 8.0 mm</span></div>
        <div class="param-row"><span class="param-name">锁轴凸台外径</span><span class="param-val">Φ 20.0 mm</span></div>
        <div class="param-row"><span class="param-name">零件总高度</span><span class="param-val">15.0 mm</span></div>
        <div class="param-row"><span class="param-name">M3 顶丝孔</span><span class="param-val">2 个 (90°夹角)</span></div>
        <div class="param-row"><span class="param-name">M4 安装孔</span><span class="param-val">4 个 (PCD 46mm)</span></div>
        <div id="btn-group">
            <button onclick="toggleWireframe()">切换线框</button>
            <button onclick="resetCamera()">重置视角</button>
        </div>
    </div>
    <div id="controls-tip">鼠标左键拖拽旋转 | 滚轮缩放 | 右键平移</div>

        const binaryString = atob(stlBase64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }

        const loader = new THREE.STLLoader();
        const geometry = loader.parse(bytes.buffer);
        geometry.computeVertexNormals();
        geometry.center();

        const material = new THREE.MeshPhysicalMaterial({
            color: 0x93c5fd,
            metalness: 0.6,
            roughness: 0.3,
            clearcoat: 0.3,
            clearcoatRoughness: 0.2
        });

        mesh.castShadow = true;
        mesh.receiveShadow = true;
        // 稍微调整朝向以便更好的初次呈现
        mesh.rotation.x = -Math.PI / 2;
        scene.add(mesh);

        function resetCamera() {
            camera.position.set(70, 60, 80);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            controls.update();
        }
        resetCamera();

        function toggleWireframe() {
            isWireframe = !isWireframe;
            material.wireframe = isWireframe;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
